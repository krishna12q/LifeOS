<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}?v=home-layout-4">
<link rel="stylesheet" href="{{ url_for('static', path='css/windows.css') }}?v=12">
<link rel="stylesheet" href="{{ url_for('static', path='css/notes-fixes.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/app-windows.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/calendar.css') }}?v=2">
<link rel="stylesheet" href="{{ url_for('static', path='css/settings.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/os-themes.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/window-themes.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/theme-details.css') }}?v=2">
<link rel="stylesheet" href="{{ url_for('static', path='css/weather.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/weather-theme.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/tasks.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/tasks-theme.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/finance.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/notifications.css') }}?v=2">
<link rel="stylesheet" href="{{ url_for('static', path='css/notifications-details.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static', path='css/music.css') }}?v=2">
<style>
/* Critical home layout: kept here to avoid a stale stylesheet shifting the desktop. */
.launcher{position:fixed!important;inset:0 auto 0 0!important;width:clamp(86px,9vw,120px)!important}
.center{position:fixed!important;inset:0 clamp(72px,8vw,96px) 0 clamp(86px,9vw,120px)!important}
.side{position:fixed!important;inset:0 0 0 auto!important;width:clamp(72px,8vw,96px)!important}
@media(max-width:900px){.launcher{width:78px!important}.center{inset-inline:78px 72px!important}.side{width:72px!important}}
</style>
</head>

<body class="home-enter">

<!-- Window Layer -->
<div id="desktop"></div>

<!-- Future Taskbar -->
<div id="taskbar"></div>

<main class="home-layout">
<!-- Left Launcher -->
<div class="launcher" id="launcher">

<div class="app" data-app="calendar">
<i class="fa-regular fa-calendar-days"></i>
<div class="label">Calendar</div>
</div>

<div class="app" data-app="tasks">
<i class="fa-solid fa-list-check"></i>
<div class="label">Tasks</div>
</div>

<div class="app" data-app="notes">
<i class="fa-regular fa-note-sticky"></i>
<div class="label">Notes</div>
</div>

<div class="app" data-app="habits">
<i class="fa-regular fa-heart"></i>
<div class="label">Habits</div>
</div>

<div class="app" data-app="finance">
<i class="fa-solid fa-wallet"></i>
<div class="label">Finance</div>
</div>

<div class="app" data-app="weather">
<i class="fa-solid fa-cloud-sun"></i>
<div class="label">Weather</div>
</div>

</div>

<!-- Center -->

<div class="center" id="desktopCenter">

<div class="hero">

<div class="clock" id="desktopClock">

<div class="ring"></div>

<div class="hand" id="hour"></div>

<div class="hand" id="minute"></div>

<div class="hand" id="second"></div>

<div class="dot"></div>

</div>

<div id="time"></div>

<div id="date"></div>

</div>

</div>

<!-- Right Dock -->

<div class="side" id="rightDock">

<div class="island">

<div class="tile" data-widget="weather">
<i class="fa-solid fa-cloud-sun"></i>
</div>

<div class="tile" data-widget="music">
<i class="fa-solid fa-music"></i>
</div>

<div class="tile" data-widget="notifications">
<i class="fa-regular fa-bell"></i>
</div>

<div class="tile" data-widget="settings">
<i class="fa-solid fa-sliders"></i>
</div>

</div>

</div>

 </main>

<script src="{{ url_for('static', path='js/windowManager.js') }}?v=29"></script>
<script src="{{ url_for('static', path='js/home.js') }}?v=6"></script>

<form action=""> 

</form>

</body>
</html>
