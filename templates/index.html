<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS Login V5</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- FastAPI Static Files -->
<link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/animations.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>

<body class="fade-enter">

<div class="topclock" id="digital"></div>

<div class="app">

<section class="auth">
<div class="auth-inner">

<h1>Welcome<br>Back</h1>

<p class="subtitle">
Enter LifeOS and continue where you left off.
</p>

<div class="field">
<i class="fa-regular fa-user"></i>
<input class="input" type="text" placeholder="Username">
</div>

<div class="field">
<i class="fa-solid fa-lock"></i>
<input class="input" type="password" placeholder="Password">
</div>

<form id="loginForm" action="/home" method="get">
<button id="signin" class="btn btn-primary lift" type="submit">
Sign In
</button>
</form>

<form action="/register" method="get">
<button class="btn btn-secondary lift" type="submit">
Create Account
</button>
</form>

</div>
</section>

<section class="preview">
<div class="preview-inner">

<div class="clock">

<div class="ring"></div>

<div class="hand" id="hour"></div>
<div class="hand" id="minute"></div>
<div class="hand" id="second"></div>

<div class="dot"></div>

</div>

<div class="brand">
LifeOS
</div>

<div class="subtitle">
One Workspace. Every Day.
</div>

<div class="pills">

<div class="pill">
<i class="fa-regular fa-calendar-days"></i>
Calendar
</div>

<div class="pill">
<i class="fa-regular fa-note-sticky"></i>
Notes
</div>

<div class="pill">
<i class="fa-solid fa-robot"></i>
AI
</div>

<div class="pill">
<i class="fa-solid fa-heart"></i>
Habits
</div>

<div class="pill">
<i class="fa-solid fa-wallet"></i>
Finance
</div>

</div>

</div>
</section>

</div>

<script src="{{ url_for('static', path='js/clock.js') }}"></script>
<script src="{{ url_for('static', path='js/login.js') }}"></script>

<script>
const h=document.getElementById("hour");
const m=document.getElementById("minute");
const s=document.getElementById("second");
const d=document.getElementById("digital");

function tick(){
    if(typeof updateClock==="function"){
        updateClock(h,m,s,d);
    }
}

tick();
setInterval(tick,1000);
</script>

</body>
</html>
